<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cards generator</title>
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <h1>Cards generator</h1>
    <section id="input_section">
      <input type="text" id="name_input" placeholder="Enter your name" />
      <input type="text" id="img_input" placeholder="Enter the img url" />
      <input
        type="text"
        id="description_input"
        placeholder="enter the description"
      />
      <div>
        <button id="add_button">Add a card</button>
        <button id="Clear_button" class="Clear">Clear</button>
      </div>
      <p id="p"></p>
    </section>
    <input type="search" placeholder="search your card" class="search" id="search" >
    <section id="Cards_section">
    </section>
    
    <script src="card.js"></script>
  </body>
</html>
